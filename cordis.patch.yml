# Bundle patch layer for dsh-web-search-insights.
#
# This file only matters when the package is installed as a bundle
# (`dsh plugin add` / plugin manager). It inserts the package's main entry as a
# plain Cordis plugin row; the row id is `web-search-insights`.
#
# Per-profile overrides belong in the profile's own cordis.patch.yml and target
# the same row id, e.g.
#
#   - id: web-search-insights
#     name: "@ypingcn/dsh-web-search-insights"
#     config:
#       directory: ~/.dsh/logs
- insert:
    - id: web-search-insights
      name: "@ypingcn/dsh-web-search-insights"
